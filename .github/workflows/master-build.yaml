name: Build and Release Installer

on:
  push:
    branches:
      - 'master'

jobs:
  build:
    name: Build Setup Project and Release
    runs-on: windows-latest

    env:
      SOLUTION_FILE: PhotoBooth.sln
      MAIN_PROJECT: MainApplication\MainApplication\MainApplication.csproj
      SETUP_PROJECT_PATH: MainApplication\Setup\Setup.vdproj

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ${{ env.SOLUTION_FILE }}

    - name: Build main application
      run: |
        msbuild ${{ env.MAIN_PROJECT }} /t:Rebuild /p:Configuration=Release /p:Platform=x64

    - name: Install VS Installer Projects extension
      shell: powershell
      run: |
        $vsInstallPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
        $vsixInstaller = Join-Path $vsInstallPath "Common7\IDE\VSIXInstaller.exe"
        Invoke-WebRequest -Uri "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/VisualStudioClient/vsextensions/MicrosoftVisualStudio2022InstallerProjects/2.0.0/vspackage" -OutFile "$env:TEMP\InstallerProjects.vsix"
        & $vsixInstaller /quiet "$env:TEMP\InstallerProjects.vsix"
        Start-Sleep -Seconds 10

    - name: Build Setup project with devenv
      shell: powershell
      run: |
        $vsInstallPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath
        $devenv = Join-Path $vsInstallPath "Common7\IDE\devenv.com"
        & $devenv ${{ env.SOLUTION_FILE }} /Build Release /Project ${{ env.SETUP_PROJECT_PATH }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Find MSI file
      id: find-msi
      run: |
        $msi = Get-ChildItem -Recurse -Filter *.msi | Select-Object -First 1
        if (!$msi) {
          Write-Error "No MSI file found"
          exit 1
        }
        echo "Found MSI at $($msi.FullName)"
        echo "msi_path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

    - name: Get latest tag and bump version
      id: versioning
      shell: bash
      run: |
        LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $LATEST_TAG"

        VERSION=${LATEST_TAG#v}
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
        NEW_MINOR=$((MINOR + 1))
        NEW_TAG="v$MAJOR.$NEW_MINOR.0"

        echo "New tag: $NEW_TAG"
        echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Create new tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git tag ${{ steps.versioning.outputs.new_tag }}
        git push origin ${{ steps.versioning.outputs.new_tag }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.versioning.outputs.new_tag }}
        name: Release ${{ steps.versioning.outputs.new_tag }}
        files: ${{ steps.find-msi.outputs.msi_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
